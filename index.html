<!DOCTYPE html>
<html>
<head>
  <title>My Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to My Shop</h1>

  <div class="products">
    
    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphone">
      <h3>Wireless Headphone</h3>
      <p>Price: $50</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
      <h3>Smart Watch</h3>
      <p>Price: $120</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500" alt="Bluetooth Speaker">
      <h3>Bluetooth Speaker</h3>
      <p>Price: $80</p>
      <button>Add to Cart</button>
    </div>

  </div>

  <script>
    const buttons = document.querySelectorAll("button");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        alert("Added to Cart!");
      });
    });
  </script>

</body>
</html>
