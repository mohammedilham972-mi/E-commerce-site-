<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntecxhub Quiz App</title>
<body>   
<div class="quiz-container">
  <div class="header">
    <h1>Syntecxhub Quiz</h1>
    <p>Test Your Front-End Knowledge</p>
  </div>

  <div id="quiz">
    <div id="progress"></div>
    <h3 id="question"></h3>
    <div class="options" id="options"></div>
    <div class="footer">
      <button id="next-btn">Next</button>
    </div>
  </div>

  <div class="result-container" id="result">
    <h2>🎉 Quiz Completed!</h2>
    <p id="score-text"></p>
    <button id="restart-btn">Restart Quiz</button>
  </div>
</div>
</body>
</html>
